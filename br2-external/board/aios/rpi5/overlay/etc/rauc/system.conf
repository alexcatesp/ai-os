[system]
compatible=ai-os-rpi5
bootloader=uboot
mountprefix=/run/rauc
statusfile=/data/rauc.status
# Solo bundles verity (necesarios para streaming y firmados de extremo a extremo)
bundle-formats=-plain

[keyring]
path=/etc/rauc/ca.cert.pem
# La RPi5 no tiene RTC: validar el certificado contra la fecha de firma del bundle, no contra el reloj local
use-bundle-signing-time=true

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=B
