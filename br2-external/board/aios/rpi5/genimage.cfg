image boot.vfat {
	vfat {
		files = {
			"bcm2712-rpi-5-b.dtb",
			"bcm2712d0-rpi-5-b.dtb",
			"rpi-firmware/config.txt",
			"rpi-firmware/cmdline.txt",
			"u-boot.bin",
			"boot.scr"
		}
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "data"
	}
	size = 512M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		align = 1M
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition rootfs-b {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
